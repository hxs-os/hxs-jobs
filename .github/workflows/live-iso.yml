name: create an HxS live iso image

on:
  workflow_dispatch:

jobs:
  create-iso:
    runs-on: ubuntu-latest
    steps:
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools
      - name: get hxsbootstrap
        run: |
          git clone --depth 1 https://git.sr.ht/~juanvel400/hxsbootstrap hxsbootstrap

      - name: build a rootfs using hxsbootstrap
        run: |
          sudo hxsbootstrap/hxsbootstrap.sh \
            -s gnu \
            -d "hxs" \
            -v 26a3 \
            -S efi \
            -a x86_64 \
            -m https://main.hxs.juanvel400.com/sets

          sudo ln -sf bash "hxs/bin/sh"

          sudo rm -rf "hxs/var/cache/hxsbootstrap"

      - name: configure adam(8)
        run: |
          cat << 'EOF' | sudo tee hxs/etc/inittab
          id:S:initdefault:
          sh:S:respawn:/bin/sh
          EOF

          sudo ln -sf usr/sbin/adam ./hxs/init

      - name: build an initramfs image
        run: |
          cd ./hxs
          sudo find . -print0 | \
          sudo cpio --null -o --format=newc | \
          sudo gzip > ../initramfs.cpio.gz

      - name: download the kernel package
        run: |
          curl -fsSL -o xpt.static-0.13.2.xpt https://main.hxs.juanvel400.com/x86_64/x/xpt.static/xpt.static-0.13.2.xpt
          curl -fsSL -o linux-7.3.4.xpt https://main.hxs.juanvel400.com/x86_64/l/linux/linux-7.3.4.xpt
          sudo mkdir -p linux-pkg xpt-pkg

          sudo tar -xpf linux-7.3.4.xpt -C linux-pkg
          sudo tar -xpf xpt.static-0.13.2.xpt -C xpt-pkg

          sudo ./xpt-pkg/usr/bin/xpt -d ./hxs -if linux-7.3.4

      - name: compose the ISO image
        run: |
          sudo mkdir -p ./iso/boot/grub
          sudo cp ./initramfs.cpio.gz ./iso/boot/initramfs.cpio.gz
          sudo cp ./linux-pkg/boot/vmlinuz-linux-7.3.4-hxs ./iso/boot/vmlinuz-linux

          cat << 'EOF' | sudo tee ./iso/boot/grub/grub.cfg
          set timeout=5

          menuentry 'HxS 26a3 Live' --id=hxs-26a3 {
            echo 'Loading HxS 26a3 Live...'
            linux /boot/vmlinuz-linux
            initrd /boot/initramfs.cpio.gz
          }
          EOF

          sudo grub-mkrescue ./iso -o hxs-26a3-x86_64.iso
          sudo sha256sum hxs-26a3-x86_64.iso | sudo tee hxs-26a3-x86_64.iso.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hxs
          path: |
            hxs-26a3-x86_64.iso
            hxs-26a3-x86_64.iso.sha256
