name: create an HxS live iso image

on:
  workflow_dispatch:
    inputs:
      hxs-version:
        description: the HxS version to use
        required: true
        type: string
        default: 26a3
      hxs-xpt-version:
        description: the xpt version to use
        required: true
        type: string
        default: 0.13.2
      hxs-linux-version:
        description: the linux kernel version to use
        required: true
        type: string
        default: 7.3.4

jobs:
  create-iso:
    runs-on: ubuntu-latest
    env:
      HXS_KERNEL_VERSION: ${{ inputs.hxs-linux-version }}
      HXS_VERSION: ${{ inputs.hxs-version }}
      HXS_XPT_VERSION: ${{ inputs.hxs-xpt-version }}
    steps:
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools cpio
      - name: get hxsbootstrap
        run: |
          git clone --depth 1 https://git.sr.ht/~juanvel400/hxsbootstrap hxsbootstrap

      - name: build a rootfs using hxsbootstrap
        run: |
          sudo hxsbootstrap/hxsbootstrap.sh \
            -s gnu \
            -d "hxs" \
            -v "$HXS_VERSION" \
            -S efi -S installer \
            -a x86_64 \
            -m https://main.hxs.juanvel400.com/sets

          sudo ln -sf bash hxs/bin/sh

          sudo rm -rf "hxs/var/cache/hxsbootstrap"

      - name: configure adam(8)
        run: |
          cat << 'EOF' | sudo tee hxs/etc/inittab
          id:S:initdefault:
          sh:S:respawn:/usr/sbin/agetty -o '-s /bin/bash' -J -a root tty1 linux
          EOF

          echo "hxs" | sudo tee hxs/etc/hostname
          echo "https://main.hxs.juanvel400.com/archive/$HXS_VERSION/x86_64" | sudo tee hxs/etc/xpt.d/index

          sudo ln -sf usr/sbin/adam ./hxs/init

      - name: download the kernel package
        run: |
          curl -fsSL -o "xpt.static-$HXS_XPT_VERSION.xpt" "https://main.hxs.juanvel400.com/x86_64/x/xpt.static/xpt.static-$HXS_XPT_VERSION.xpt"
          curl -fsSL -o "linux-$HXS_KERNEL_VERSION.xpt" "https://main.hxs.juanvel400.com/x86_64/l/linux/linux-$HXS_KERNEL_VERSION.xpt"
          sudo mkdir -p linux-pkg xpt-pkg

          sudo tar -xpf "linux-$HXS_KERNEL_VERSION.xpt" -C linux-pkg
          sudo tar -xpf "xpt.static-$HXS_XPT_VERSION.xpt" -C xpt-pkg

          sudo ./xpt-pkg/usr/bin/xpt -d ./hxs -if "linux-$HXS_KERNEL_VERSION.xpt"

      - name: build an initramfs image
        run: |
          cd ./hxs
          sudo find . -print0 | \
          sudo cpio --null -o --format=newc | \
          sudo gzip > ../initramfs.cpio.gz

      - name: compose the ISO image
        run: |
          sudo mkdir -p ./iso/boot/grub
          sudo cp ./initramfs.cpio.gz ./iso/boot/initramfs.cpio.gz
          sudo cp "./linux-pkg/boot/vmlinuz-linux-$HXS_KERNEL_VERSION-hxs" ./iso/boot/vmlinuz-linux

          cat << EOF | sudo tee ./iso/boot/grub/grub.cfg
          set timeout=5
          set default=hxs-live

          menuentry 'HxS $HXS_VERSION Live' --id=hxs-live {
            echo 'Loading HxS $HXS_VERSION Live...'
            linux /boot/vmlinuz-linux quiet
            initrd /boot/initramfs.cpio.gz
          }
          EOF

          sudo grub-mkrescue \
            --product-name="HxS" --product-version="$HXS_VERSION" \
            ./iso -o "hxs.live-$HXS_VERSION-x86_64.iso"
          sudo sha256sum "hxs.live-$HXS_VERSION-x86_64.iso" | sudo tee "hxs.live-$HXS_VERSION-x86_64.iso.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hxs.live
          path: |
            hxs.live-${{ inputs.hxs-version }}-x86_64.iso
            hxs.live-${{ inputs.hxs-version}}-x86_64.iso.sha256
