name: create HxS tarballs and containers

on:
  workflow_dispatch:

jobs:
  create-tarball:
    strategy:
      fail-fast: false
      matrix:
        set: [standard, gnu, suckless, suckless-minimal, minimal]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      SET: ${{ matrix.set }}
    steps:
      - name: get hxsbootstrap
        run: |
          git clone --depth 1 https://git.sr.ht/~juanvel400/hxsbootstrap hxsbootstrap

      - name: build a rootfs using hxsbootstrap
        run: |
          sudo hxsbootstrap/hxsbootstrap.sh \
            -s "$SET" \
            -d "hxs.$SET-target" \
            -v 26a3 \
            -a x86_64 \
            -m https://main.hxs.juanvel400.com/sets

          if [ "$SET" != "gnu" ]; then
            sudo ln -sf dash "hxs.$SET-target/bin/sh"
          else
            sudo ln -sf bash "hxs.$SET-target/bin/sh"
          fi

          echo "https://main.hxs.juanvel400.com/archive/26a3/x86_64/xpt.index" \
            | sudo tee "hxs.$SET-target/etc/xpt.d/index"

      - name: remove hxsbootstrap cache
        run: sudo rm -r "hxs.$SET-target/var/cache/hxsbootstrap"

      - name: package
        run: sudo tar --numeric-owner --owner=0 --group=0 --sort=name --mtime='UTC 2026-11-14' --zstd -cf "hxs.$SET-26a3-x86_64.tar.zst" -C "hxs.$SET-target" .

      - name: checksum
        run: sha256sum "hxs.$SET-26a3-x86_64.tar.zst" > "hxs.$SET-26a3-x86_64.tar.zst.sha256"

      - name: container image
        run: |
          zstd -dc "hxs.$SET-26a3-x86_64.tar.zst" | \
            sudo podman import --arch amd64 --os linux --change 'CMD ["/bin/sh"]' - "hxs.$SET:26a3"
          sudo podman run --rm "hxs.$SET:26a3" /bin/sh -c 'echo ok'

      - name: push image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo podman push "hxs.$SET:26a3" "ghcr.io/juanvel4000/hxs.$SET:26a3"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hxs.${{ matrix.set }}
          path: |
            hxs.${{ matrix.set }}-26a3-x86_64.tar.zst
            hxs.${{ matrix.set }}-26a3-x86_64.tar.zst.sha256
