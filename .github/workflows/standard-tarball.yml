name: create an HxS standard tarball

on:
  workflow_dispatch:

jobs:
  create-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: get hxsbootstrap
        run: |
          git clone --depth 1 https://git.sr.ht/~juanvel400/hxsbootstrap hxsbootstrap

      - name: build a rootfs using hxsbootstrap
        run: sudo hxsbootstrap/hxsbootstrap.sh -s standard -d hxs.standard-target

      - name: remove hxsbootstrap cache
        run: sudo rm -r hxs.standard-target/var/cache/hxsbootstrap
      - name: package
        run: sudo tar --sort=name --mtime='2026-11-14' --zstd -cf hxs.standard-26a2-x86_64.tar.zst -C hxs.standard-target .

      - name: checksum
        run: sha256sum hxs.standard-26a2-x86_64.tar.zst > hxs.standard-26a2-x86_64.tar.zst.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hxs.standard
          path: hxs.standard-26a2-x86_64.tar.zst*

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 26a2 hxs.standard-26a2-x86_64.tar.zst* --clobber
